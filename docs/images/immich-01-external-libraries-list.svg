<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="760" fill="#0b0b0d"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#0b0b0d" stroke="#232326" stroke-width="1"/>
  <text x="24" y="35" font-size="20" font-weight="700" fill="#f2f3f5">immich</text>
  <rect x="300" y="16" width="500" height="24" rx="12" fill="#151517" stroke="#28282b"/>
  <text x="316" y="32" font-size="12" fill="#8a8a90">Pesquisar fotos</text>
  <rect x="1010" y="16" width="70" height="24" rx="12" fill="#1c1c1f"/>
  <text x="1024" y="32" font-size="11" fill="#c7c8cc">Contexto</text>
  <circle cx="1150" cy="28" r="15" fill="#e8623a"/>
  <text x="1145" y="33" font-size="12" fill="#0b0b0d" font-weight="700">A</text>

  <!-- sidebar -->
  <rect x="0" y="56" width="240" height="704" fill="#0b0b0d" stroke="#1c1c1f"/>
  <g font-size="13.5" fill="#c7c8cc">
    <text x="56" y="138">Utilizadores</text>
  </g>
  <rect x="0" y="168" width="240" height="36" fill="#17181f"/>
  <rect x="0" y="168" width="3" height="36" fill="#6b7bd6"/>
  <text x="56" y="191" font-size="13.5" font-weight="600" fill="#a9b3ec">Bibliotecas externas</text>
  <g font-size="13.5" fill="#c7c8cc">
    <text x="56" y="238">Filas de tarefas</text>
    <text x="56" y="288">Definições</text>
    <text x="56" y="338">Manutenção</text>
    <text x="56" y="388">Estado do servidor</text>
  </g>

  <!-- storage widget -->
  <rect x="16" y="620" width="208" height="72" rx="8" fill="#141416" stroke="#232326"/>
  <text x="28" y="642" font-size="11.5" fill="#e4e4e7" font-weight="600">Espaço de armazenamento</text>
  <text x="28" y="660" font-size="11" fill="#9296a3">Utilizado 423,7 GiB de 950,6 GiB</text>
  <rect x="28" y="670" width="180" height="6" rx="3" fill="#232326"/>
  <rect x="28" y="670" width="70" height="6" rx="3" fill="#6b7bd6"/>

  <!-- main content -->
  <text x="264" y="98" font-size="20" font-weight="600" fill="#f2f3f5">Bibliotecas externas</text>
  <rect x="900" y="80" width="170" height="26" rx="4" fill="#151517"/>
  <text x="912" y="98" font-size="11.5" fill="#a9b3ec">↻ Analisar todas as bibliotecas</text>
  <rect x="1080" y="80" width="104" height="26" rx="4" fill="#151517"/>
  <text x="1092" y="98" font-size="11.5" fill="#a9b3ec">⊞ Criar biblioteca</text>

  <!-- table -->
  <rect x="264" y="130" width="920" height="40" fill="#101012" stroke="#1c1c1f"/>
  <text x="380" y="154" font-size="12.5" fill="#8a8ecf" font-weight="700">Nome</text>
  <text x="640" y="154" font-size="12.5" fill="#8a8ecf" font-weight="700">Dono</text>
  <text x="800" y="154" font-size="12.5" fill="#8a8ecf" font-weight="700">Fotos</text>
  <text x="890" y="154" font-size="12.5" fill="#8a8ecf" font-weight="700">Vídeos</text>
  <text x="980" y="154" font-size="12.5" fill="#8a8ecf" font-weight="700">Tamanho</text>

  <rect x="264" y="170" width="920" height="56" fill="#0e0e10" stroke="#1c1c1f"/>
  <text x="380" y="204" font-size="14" fill="#8a8ecf" text-decoration="underline">New External Library</text>
  <text x="640" y="204" font-size="13" fill="#8a8ecf" text-decoration="underline">Admin</text>
  <text x="800" y="204" font-size="13" fill="#e4e4e7">13 537</text>
  <text x="890" y="204" font-size="13" fill="#e4e4e7">1 192</text>
  <text x="980" y="204" font-size="13" fill="#e4e4e7">42 GiB</text>
  <text x="1148" y="204" font-size="16" fill="#8a8a90">⋮</text>

  <!-- annotation -->
  <rect x="330" y="178" width="330" height="40" fill="none" stroke="#f5a524" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 500 280 L 500 222" stroke="#f5a524" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5a524"/>
    </marker>
  </defs>
  <rect x="300" y="284" width="440" height="34" rx="6" fill="#3a2c10" stroke="#f5a524"/>
  <text x="316" y="306" font-size="13" fill="#f5a524" font-weight="600">1. Clicar no nome "New External Library"</text>
</svg>
