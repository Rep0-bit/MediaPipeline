<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <!-- outer frame -->
  <rect x="0" y="0" width="1200" height="760" rx="8" fill="#101216" stroke="#3a3d45" stroke-width="1.5"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="1200" height="40" rx="8" fill="#e8e8ea"/>
  <rect x="0" y="20" width="1200" height="20" fill="#e8e8ea"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="66" cy="20" r="6" fill="#28c840"/>
  <rect x="110" y="9" width="560" height="22" rx="11" fill="#ffffff" stroke="#cfd2d6"/>
  <text x="128" y="24" font-size="12" fill="#555a63">localhost:2283/admin/library-management</text>

  <!-- sidebar -->
  <rect x="0" y="40" width="220" height="720" fill="#17191d"/>
  <text x="20" y="75" font-size="18" font-weight="700" fill="#f2f3f5">immich</text>

  <g font-size="13" fill="#9296a3">
    <text x="24" y="115">Photos</text>
    <text x="24" y="145">Explore</text>
    <text x="24" y="175">Albums</text>
    <text x="24" y="205">People</text>
    <text x="24" y="235">Places</text>
  </g>
  <line x1="20" y1="255" x2="200" y2="255" stroke="#2a2d34"/>
  <text x="24" y="278" font-size="11" fill="#5c606b" letter-spacing="1">ADMINISTRATION</text>
  <g font-size="13" fill="#9296a3">
    <text x="24" y="308">Users</text>
    <text x="24" y="338">Jobs</text>
  </g>
  <!-- active item -->
  <rect x="0" y="356" width="220" height="34" fill="#252a45"/>
  <rect x="0" y="356" width="4" height="34" fill="#7b88e8"/>
  <text x="24" y="378" font-size="13" font-weight="600" fill="#c7cbf5">External Libraries</text>
  <g font-size="13" fill="#9296a3">
    <text x="24" y="418">Settings</text>
  </g>

  <!-- main content -->
  <text x="252" y="90" font-size="22" font-weight="700" fill="#f2f3f5">External Libraries</text>
  <text x="252" y="118" font-size="13" fill="#9296a3">Manage libraries that reference files outside the upload folder.</text>

  <!-- table header -->
  <rect x="252" y="150" width="900" height="42" fill="#1c1e24" stroke="#2a2d34"/>
  <text x="270" y="176" font-size="12" fill="#9296a3" font-weight="600">NAME</text>
  <text x="620" y="176" font-size="12" fill="#9296a3" font-weight="600">IMPORT PATHS</text>
  <text x="980" y="176" font-size="12" fill="#9296a3" font-weight="600">ACTIONS</text>

  <!-- row -->
  <rect x="252" y="192" width="900" height="56" fill="#16181d" stroke="#2a2d34"/>
  <text x="270" y="226" font-size="14" fill="#e4e4e7">New External Library</text>
  <text x="620" y="220" font-size="12" fill="#f5a524">/mnt/photos</text>
  <text x="620" y="236" font-size="12" fill="#9cc4ff">/mnt/organized</text>
  <rect x="972" y="208" width="60" height="24" rx="4" fill="#252a45"/>
  <text x="984" y="224" font-size="11" fill="#c7cbf5">Edit</text>
  <rect x="1040" y="208" width="64" height="24" rx="4" fill="#252a45"/>
  <text x="1050" y="224" font-size="11" fill="#c7cbf5">Scan</text>

  <!-- annotation callout -->
  <rect x="252" y="192" width="900" height="56" fill="none" stroke="#f5a524" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 700 270 L 700 250" stroke="#f5a524" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5a524"/>
    </marker>
  </defs>
  <rect x="490" y="270" width="420" height="34" rx="6" fill="#3a2c10" stroke="#f5a524"/>
  <text x="508" y="292" font-size="13" fill="#f5a524" font-weight="600">1. Clicar em "Edit" para ver/editar os import paths</text>
