<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="760" fill="#0b0b0d"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#0b0b0d" stroke="#232326" stroke-width="1"/>
  <text x="24" y="35" font-size="20" font-weight="700" fill="#f2f3f5">immich</text>
  <rect x="300" y="16" width="500" height="24" rx="12" fill="#151517" stroke="#28282b"/>
  <text x="316" y="32" font-size="12" fill="#8a8a90">Pesquisar fotos</text>
  <circle cx="1150" cy="28" r="15" fill="#e8623a"/>
  <text x="1145" y="33" font-size="12" fill="#0b0b0d" font-weight="700">A</text>

  <!-- sidebar -->
  <rect x="0" y="56" width="240" height="704" fill="#0b0b0d" stroke="#1c1c1f"/>
  <g font-size="13.5" fill="#c7c8cc">
    <text x="56" y="138">Utilizadores</text>
  </g>
  <rect x="0" y="168" width="240" height="36" fill="#17181f"/>
  <rect x="0" y="168" width="3" height="36" fill="#6b7bd6"/>
  <text x="56" y="191" font-size="13.5" font-weight="600" fill="#a9b3ec">Bibliotecas externas</text>
  <g font-size="13.5" fill="#c7c8cc">
    <text x="56" y="238">Filas de tarefas</text>
    <text x="56" y="288">Definições</text>
    <text x="56" y="338">Manutenção</text>
    <text x="56" y="388">Estado do servidor</text>
  </g>

  <!-- storage widget -->
  <rect x="16" y="620" width="208" height="72" rx="8" fill="#141416" stroke="#232326"/>
  <text x="28" y="642" font-size="11.5" fill="#e4e4e7" font-weight="600">Espaço de armazenamento</text>
  <text x="28" y="660" font-size="11" fill="#9296a3">Utilizado 423,7 GiB de 950,6 GiB</text>
  <rect x="28" y="670" width="180" height="6" rx="3" fill="#232326"/>
  <rect x="28" y="670" width="70" height="6" rx="3" fill="#6b7bd6"/>

  <!-- main content -->
  <text x="264" y="82" font-size="12.5" fill="#8a8ecf" text-decoration="underline">Bibliotecas externas</text>
  <text x="404" y="82" font-size="12.5" fill="#8a8a90"> / New External Library</text>

  <rect x="978" y="66" width="76" height="26" rx="4" fill="#151517"/>
  <text x="988" y="84" font-size="11.5" fill="#a9b3ec">↻ Analisar</text>
  <rect x="1060" y="66" width="66" height="26" rx="4" fill="#151517"/>
  <text x="1070" y="84" font-size="11.5" fill="#a9b3ec">✎ Editar</text>
  <rect x="1132" y="66" width="52" height="26" rx="4" fill="#151517"/>
  <text x="1140" y="84" font-size="11.5" fill="#e0607a">🗑 Eliminar</text>

  <text x="264" y="126" font-size="26" font-weight="700" fill="#f2f3f5">New External Library</text>

  <!-- stat cards -->
  <rect x="264" y="150" width="212" height="86" rx="8" fill="#141416" stroke="#232326"/>
  <text x="284" y="176" font-size="13" fill="#8a8ecf" font-weight="600">Fotos</text>
  <text x="284" y="210" font-size="20" fill="#e4e4e7" font-weight="700">7 364</text>

  <rect x="490" y="150" width="212" height="86" rx="8" fill="#141416" stroke="#232326"/>
  <text x="510" y="176" font-size="13" fill="#8a8ecf" font-weight="600">Vídeos</text>
  <text x="510" y="210" font-size="20" fill="#e4e4e7" font-weight="700">596</text>

  <rect x="716" y="150" width="212" height="86" rx="8" fill="#141416" stroke="#232326"/>
  <text x="736" y="176" font-size="13" fill="#8a8ecf" font-weight="600">Utilização</text>
  <text x="736" y="210" font-size="20" fill="#e4e4e7" font-weight="700">21,2 GiB</text>

  <!-- Pastas panel -->
  <rect x="264" y="256" width="500" height="150" rx="8" fill="#141416" stroke="#232326"/>
  <text x="284" y="284" font-size="15" font-weight="700" fill="#e4e4e7">📁 Pastas</text>
  <rect x="628" y="270" width="110" height="26" rx="4" fill="#1c1c1f"/>
  <text x="640" y="288" font-size="11.5" fill="#a9b3ec">+ Adicionar</text>

  <!-- only remaining path -->
  <rect x="284" y="304" width="460" height="42" rx="6" fill="#12201a" stroke="#2a5a3f"/>
  <text x="300" y="330" font-size="13" fill="#bfe8d0" font-family="Consolas, monospace">/mnt/organized</text>
  <circle cx="672" cy="325" r="13" fill="#1c1c1f"/>
  <text x="666" y="330" font-size="12" fill="#a9b3ec">✎</text>
  <circle cx="708" cy="325" r="13" fill="#16281f"/>
  <text x="702" y="330" font-size="12" fill="#7fae90">🗑</text>

  <!-- success annotation -->
  <circle cx="960" cy="325" r="18" fill="#123420" stroke="#3fbf72" stroke-width="2.5"/>
  <path d="M 952 325 L 958 332 L 970 318" stroke="#3fbf72" stroke-width="3" fill="none"/>
  <text x="800" y="330" font-size="13" fill="#8fd6a8" font-weight="700">✓ Configuração correta</text>

  <!-- Padrão de exclusão panel -->
  <rect x="784" y="256" width="400" height="150" rx="8" fill="#141416" stroke="#232326"/>
  <text x="804" y="284" font-size="15" font-weight="700" fill="#e4e4e7">▽ Padrão de exclusão</text>
  <text x="804" y="312" font-size="11.5" fill="#9296a3" font-family="Consolas, monospace">**/@eaDir/**  **/._*  **/#recycle/**</text>
  <text x="804" y="332" font-size="11.5" fill="#9296a3" font-family="Consolas, monospace">**/#snapshot/**  **/.stversions/**</text>
  <text x="804" y="352" font-size="11.5" fill="#9296a3" font-family="Consolas, monospace">**/.stfolder/**</text>

  <!-- note -->
  <rect x="264" y="424" width="920" height="60" rx="8" fill="#12200f" stroke="#3fbf72"/>
  <text x="284" y="448" font-size="12.5" fill="#8fd6a8">Só "/mnt/organized" deve constar em "Pastas". Contagens de Fotos/Vídeos</text>
  <text x="284" y="468" font-size="12.5" fill="#8fd6a8">acima ficam corretas depois do próximo scan (ver passo 4).</text>
</svg>
